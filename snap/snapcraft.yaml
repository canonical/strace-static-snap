name: strace-static
version: "6.15"
summary: diagnostic, debugging and instructional userspace utility
description: |
  strace is a diagnostic, debugging and instructional userspace utility for Linux
build-base: core22
base: bare
confinement: strict
license: LGPL-2.1-or-later
assumes:
 - snapd2.64

apps:
  strace-static:
    command: bin/strace

parts:
  strace:
    plugin: autotools
    source: https://github.com/strace/strace/releases/download/v6.15/strace-6.15.tar.xz
    build-packages:
      - gawk
      - on s390x:
        - g++-multilib
        - gcc-multilib
      - on amd64:
        - g++-multilib
        - gcc-multilib
        - libiberty-dev
        - libunwind-dev
    autotools-configure-parameters:
      - --prefix=/
      - --enable-mpers=check
      - LDFLAGS='-static -pthread'
    prime:
      - bin/strace
